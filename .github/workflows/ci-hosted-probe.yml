name: GitHub hosted availability
run-name: Arteamis hosted probe ${{ inputs.nonce }}

on:
  #checkov:skip=CKV_GHA_7:Correlation nonce only; this probe cannot build or release.
  workflow_dispatch:
    inputs:
      nonce:
        description: Controller correlation identifier
        required: true
        type: string

permissions: {}

jobs:
  available:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - run: echo 'GitHub-hosted runner available'
