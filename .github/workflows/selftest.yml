name: selftest

# The platform is production for every other repository, so it gets its own CI:
# the workflows must parse, the shell must be sane, and the manifest parser must
# still produce the outputs the dispatcher depends on.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: selftest
    needs: [lint, manifest-parser, tester-agent, terraform]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every selftest job to pass
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['JOB_RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Selftests did not pass: ' + ', '.join(failed))
          PY

  lint:
    name: workflows & shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # validate pinned action paths in historical commits

      - name: Verify internal workflow and action pins
        run: python3 scripts/check_internal_pins.py

      - name: Test documentation checks
        run: |
          python3 -m unittest discover -s actions/docs-check -p 'test_*.py'
          python3 -m unittest discover -s ops -p 'test_*.py'
          bash -n ops/restore-backup.sh
          fixture_dir=$(mktemp -d)
          cp environments/production/backend.compose.yml "$fixture_dir/compose.yml"
          touch "$fixture_dir/.env" "$fixture_dir/.env.infra"
          (cd "$fixture_dir" && docker compose --env-file /dev/null -f compose.yml config --no-env-resolution --no-path-resolution --format json) > /tmp/stack.json
          python3 -m pip install --quiet PyYAML==6.0.3
          python3 ops/check-compose.py environments/production/backend.compose.yml
          rm -rf "$fixture_dir"

      - name: actionlint
        run: |
          bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color -shellcheck=

      - name: shellcheck
        run: shellcheck actions/*/*.sh ops/*.sh

  manifest-parser:
    name: manifest parser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The dispatcher gets yq from the load-manifest action; when we call
      # parse.sh directly we must provide it ourselves, and pin the flavour so
      # the assertions below can't be fooled by a different yq on the runner.
      - name: Install yq (mikefarah)
        run: |
          sudo curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
          yq --version

      # GITHUB_OUTPUT and GITHUB_STEP_SUMMARY are reserved runner variables: the
      # runner re-points them per step, so setting them under `env:` is ignored.
      # They must be exported inside the script for the child process to see them.
      - name: A service manifest resolves to a production VM deploy
        env:
          MANIFEST: /tmp/service.yml
          EVENT_NAME: push
          REF_NAME: deploy/prod
          REPO: devsecops-playground-org/tasmil-ai
        run: |
          cat >/tmp/service.yml <<'YML'
          project: tasmil
          component: ai
          type: service
          runtime: python
          package_manager: poetry
          test:
            command: pytest
            coverage_min: 60
          deploy:
            target: vm
            registry_user: deploy-bot
            environments:
              staging:   { branch: deploy/staging }
              production: { branch: deploy/prod }
          YML
          export GITHUB_OUTPUT=/tmp/out.env GITHUB_STEP_SUMMARY=/tmp/summary.md
          : >/tmp/out.env
          ./actions/load-manifest/parse.sh
          cat /tmp/out.env
          grep -qx 'environment=production' /tmp/out.env
          grep -qx 'should_build=true' /tmp/out.env
          grep -qx 'should_deploy=true' /tmp/out.env
          grep -qx 'remote_path=/opt/tasmil/ai' /tmp/out.env
          grep -qx 'registry_user=deploy-bot' /tmp/out.env
          grep -qx 'image=ghcr.io/devsecops-playground-org/tasmil-ai' /tmp/out.env

      - name: A pull request never deploys
        env:
          MANIFEST: /tmp/service.yml
          EVENT_NAME: pull_request
          REF_NAME: feature/x
          REPO: devsecops-playground-org/tasmil-ai
        run: |
          export GITHUB_OUTPUT=/tmp/out2.env GITHUB_STEP_SUMMARY=/tmp/summary.md
          : >/tmp/out2.env
          ./actions/load-manifest/parse.sh
          grep -qx 'environment=' /tmp/out2.env
          grep -qx 'should_deploy=false' /tmp/out2.env

      - name: Production from main deploys only on a dispatch that names it
        env:
          REPO: arteamis-system/backend
        run: |
          cat >/tmp/main.yml <<'YML'
          project: arteamis
          component: backend
          deploy:
            target: vm
            service: backend
            phases: [db-bootstrap, db-backup, db-migrate, db-finalize]
            services: [backend, worker]
            migration_phase: db-migrate
            ship: [infra]
            preflight: test -f .env.infra
            environments:
              production: { branch: main, trigger: dispatch, url: https://api.example.test }
          YML
          export MANIFEST=/tmp/main.yml GITHUB_STEP_SUMMARY=/tmp/summary.md
          run() { : >"$GITHUB_OUTPUT"; EVENT_NAME="$1" REF_NAME="$2" DISPATCH_ENVIRONMENT="$3" ./actions/load-manifest/parse.sh; }

          export GITHUB_OUTPUT=/tmp/push.env
          run push main ""
          grep -qx 'should_deploy=false' /tmp/push.env   # a merge to main is not a release

          export GITHUB_OUTPUT=/tmp/plain-dispatch.env
          run workflow_dispatch main ""
          grep -qx 'should_deploy=false' /tmp/plain-dispatch.env

          export GITHUB_OUTPUT=/tmp/release.env
          run workflow_dispatch main production
          cat /tmp/release.env
          grep -qx 'environment=production' /tmp/release.env
          grep -qx 'should_deploy=true' /tmp/release.env
          grep -qx 'phases=db-bootstrap db-backup db-migrate db-finalize' /tmp/release.env
          grep -qx 'services=backend worker' /tmp/release.env
          grep -qx 'migration_phase=db-migrate' /tmp/release.env
          grep -qx 'ship=infra' /tmp/release.env
          grep -qx 'preflight=test -f .env.infra' /tmp/release.env

          export GITHUB_OUTPUT=/tmp/wrong-ref.env
          if run workflow_dispatch feature/x production; then
            echo "::error::a production release from a non-main ref was accepted"
            exit 1
          fi

      - name: A mirror frontend resolves its mirror branch per environment
        env:
          MANIFEST: /tmp/web.yml
          EVENT_NAME: workflow_dispatch
          REF_NAME: main
          DISPATCH_ENVIRONMENT: production
          REPO: arteamis-system/web
        run: |
          cat >/tmp/web.yml <<'YML'
          project: arteamis
          component: frontend
          type: frontend
          deploy:
            target: mirror
            mirror: { repo: deployer/web, user: deployer }
            environments:
              production: { branch: main, trigger: dispatch, mirror_branch: main }
          YML
          export GITHUB_OUTPUT=/tmp/web.env GITHUB_STEP_SUMMARY=/tmp/summary.md
          : >/tmp/web.env
          ./actions/load-manifest/parse.sh
          grep -qx 'should_deploy=true' /tmp/web.env
          grep -qx 'should_build=false' /tmp/web.env
          grep -qx 'mirror_repo=deployer/web' /tmp/web.env
          grep -qx 'mirror_branch=main' /tmp/web.env
          printf 'project: a\ncomponent: b\ndeploy:\n  target: mirror\n' >/tmp/web-bad.yml
          if MANIFEST=/tmp/web-bad.yml ./actions/load-manifest/parse.sh; then
            echo "::error::a mirror target without a mirror repo was accepted"
            exit 1
          fi

      - name: An invalid manifest fails loudly
        env:
          MANIFEST: /tmp/bad.yml
          EVENT_NAME: push
          REF_NAME: main
          REPO: devsecops-playground-org/x
        run: |
          export GITHUB_OUTPUT=/tmp/out3.env GITHUB_STEP_SUMMARY=/tmp/summary.md
          printf 'component: api\ntype: service\n' >/tmp/bad.yml
          : >/tmp/out3.env
          if ./actions/load-manifest/parse.sh; then
            echo "::error::parser accepted a manifest with no project field"
            exit 1
          fi
          echo "Rejected as expected."

  tester-agent:
    name: tester agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Build and test the agent
        working-directory: tester-agent
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run test:ci
          npm run build

      # Findings routing is dependency-free, so its pure functions run directly
      # on the runner's node with the built-in test runner.
      - name: Test findings routing
        working-directory: actions/report-findings
        run: node --test

      # Asserts the schema accepts a valid report AND rejects each broken variant,
      # so the contract is genuinely guarded rather than nominally present.
      - name: Validate the report schema
        run: |
          npm install --no-save ajv@8 >/dev/null 2>&1
          node policy/schemas/validate.mjs

  terraform:
    name: terraform modules and environment roots
    env:
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-provider-cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "1.14.0"
      - run: terraform fmt -check -recursive modules/ environments/
      - name: Validate each module
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          for dir in modules/*/ environments/*/; do
            echo "--- $dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
          done
