name: deploy-vm

# Deploy a component's compose services onto a VM that may host several components.
#
# Without `phases`, exactly one service is recreated with `up -d --no-deps`, which
# is what lets a push to tasmil-ai leave tasmil-backend and tasmil-mcp untouched.
#
# With `phases` (one-shot services such as bootstrap, backup, migrate, finalize),
# the release stops the long-running services, runs the phases in their compose
# dependency order, then starts the services again: a schema change must finish
# before any API or worker process sees the new catalog. A failure before the
# `migration_phase` starts rolls the services back to the previous image; after it,
# the release stops and leaves the services down for a person, because replacing
# containers does not roll back a migrated database.

on:
  workflow_call:
    inputs:
      project:        { type: string, required: true }
      component:      { type: string, required: true }
      environment:    { type: string, required: true }
      image:          { type: string, required: true }
      image_ref:      { type: string, required: true }
      registry_user:  { type: string, required: false, default: "" }
      service:        { type: string, required: true }
      container_name: { type: string, required: true }
      compose_file:   { type: string, required: false, default: docker-compose.prod.yml }
      remote_path:    { type: string, required: true }
      health_path:    { type: string, required: false, default: "" }
      health_port:    { type: string, required: false, default: "" }
      url:            { type: string, required: false, default: "" }
      phases:          { type: string, required: false, default: "" }
      services:        { type: string, required: false, default: "" }
      migration_phase: { type: string, required: false, default: "" }
      ship:            { type: string, required: false, default: "" }
      preflight:       { type: string, required: false, default: "" }
      verify_signature:
        description: Refuse to deploy an image that cosign cannot verify.
        type: boolean
        required: false
        default: true
      signer_identity_regexp:
        description: >
          Regexp the signing certificate's identity must match. Keyless signing
          binds the identity to the workflow the signing job is DEFINED in, which
          is this platform's own build-scan-sign.yml — not the repository being
          deployed. Defaults to that workflow in <owner>/platform; override only
          if a caller's images are signed somewhere else.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  packages: read
  id-token: write
  deployments: write # the release record

jobs:
  deploy:
    name: deploy ${{ inputs.component }} → ${{ inputs.environment }}
    runs-on: ${{ fromJSON(format(github.repository == 'arteamis-system/platform' && '["ubuntu-24.04"]' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && '["ubuntu-24.04"]' || vars.ARTEAMIS_CI_RUNNERS || '["ubuntu-24.04"]', github.run_id)) }}
    timeout-minutes: 45
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    steps:
      - uses: actions/checkout@v7

      # Which platform commit is running this release. Reusable workflows cannot
      # see their own revision in the expression contexts, but the job's OIDC
      # token states it (`job_workflow_sha`), signed by GitHub.
      - name: Identify the platform revision
        id: platform
        run: |
          set -euo pipefail
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=release-record" | jq -r .value)
          claims=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while (( ${#claims} % 4 )); do claims+="="; done
          sha=$(base64 -d <<<"$claims" | jq -r .job_workflow_sha)
          echo "sha=$sha" >>"$GITHUB_OUTPUT"
          echo "Platform revision: $sha"

      - name: Check out the reviewed platform assembly
        if: ${{ startsWith(inputs.compose_file, 'platform:') }}
        uses: actions/checkout@v7
        with:
          repository: arteamis-system/platform
          ref: ${{ steps.platform.outputs.sha }}
          path: .platform-release
          persist-credentials: false

      # A deploy that fails halfway because a secret is missing is worse than one
      # that never starts. Everything required is checked up front, by name.
      - name: Validate deploy secrets
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ inputs.registry_user }}
        run: |
          missing=()
          if [[ -z "$VM_HOST"    ]]; then missing+=("VM_HOST"); fi
          if [[ -z "$VM_USER"    ]]; then missing+=("VM_USER"); fi
          if [[ -z "$VM_SSH_KEY" ]]; then missing+=("VM_SSH_KEY"); fi
          if [[ -n "$GHCR_PULL_TOKEN" && -z "$GHCR_USER" ]]; then
            echo "::error::GHCR_PULL_TOKEN requires deploy.registry_user so the PAT is paired with its owner."
            exit 1
          fi
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets for the '${{ inputs.environment }}' environment: ${missing[*]}"
            echo "::error::Add them under Settings → Environments → ${{ inputs.environment }} → Environment secrets."
            echo "::error::gh secret set ${missing[0]} --repo ${{ github.repository }} --env ${{ inputs.environment }}"
            exit 1
          fi
          echo "All required deploy secrets are present."

      - uses: sigstore/cosign-installer@v4.1.2
        if: ${{ inputs.verify_signature }}

      # cosign takes its registry credentials from the docker config, and the
      # images this deploys are private packages. Without a login it never reaches
      # the signature at all: ghcr answers the anonymous token request with
      # UNAUTHORIZED, and the gate below reports that as "could not verify" — a
      # step that looks like it ran when it never got started.
      - name: Log in to ghcr so cosign can read the signature
        if: ${{ inputs.verify_signature }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the image signature before it touches the VM
        if: ${{ inputs.verify_signature }}
        env:
          IMAGE_REF: ${{ inputs.image_ref }}
          SIGNER_IDENTITY_REGEXP: ${{ inputs.signer_identity_regexp }}
          PLATFORM_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail

          # Keyless signing binds the certificate identity to the workflow the
          # signing job is DEFINED in. That job lives in build-scan-sign.yml here
          # in the platform, so the identity reads
          #   https://github.com/<owner>/platform/.github/workflows/build-scan-sign.yml@<ref>
          # This used to match on `github.repository`, which inside a reusable
          # workflow is the CALLING repo — a string the certificate can never
          # carry. So the gate could not have passed even with credentials.
          identity="${SIGNER_IDENTITY_REGEXP:-}"
          if [[ -z "$identity" ]]; then
            identity="^https://github\.com/${PLATFORM_OWNER}/platform/\.github/workflows/build-scan-sign\.yml@"
          fi

          # No `continue-on-error`, no `|| warning`. The input above says this
          # refuses to deploy an image it cannot verify; swallowing the result
          # made that promise false, and an unverified image reached the VM with
          # nothing but an annotation to show for it. Failing here is the point:
          # every step that touches the VM comes after this one.
          cosign verify "$IMAGE_REF" \
            --certificate-identity-regexp "$identity" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            >/dev/null

          echo "Signature verified against: $identity"

      - name: Configure SSH
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VM_SSH_KEY" >~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$VM_PORT" -H "$VM_HOST" >>~/.ssh/known_hosts 2>/dev/null

      # Authenticate and pull before changing compose, runtime secrets or image.env
      # on the VM. A bad registry credential must leave the live deployment wholly
      # untouched, rather than producing a new-config/old-container split.
      - name: Preflight image pull on the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ inputs.registry_user }}
          JOB_TOKEN: ${{ github.token }}
          JOB_USER: ${{ github.actor }}
        run: |
          # A dedicated PAT is optional. For a package owned by this repository,
          # the short-lived job token is safer and already has packages:read.
          if [[ -n "$GHCR_PULL_TOKEN" ]]; then
            registry_token="$GHCR_PULL_TOKEN"
            registry_user="$GHCR_USER"
          else
            registry_token="$JOB_TOKEN"
            registry_user="$JOB_USER"
          fi

          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            IMAGE_REF='${{ inputs.image_ref }}' \
            GHCR_USER="$registry_user" \
            GHCR_TOKEN="$registry_token" \
            bash -se <<'REMOTE'
          set -euo pipefail

          auth_dir=$(mktemp -d /tmp/platform-ghcr-auth.XXXXXX)
          cleanup() {
            rm -f "$auth_dir/config.json"
            rmdir "$auth_dir" 2>/dev/null || true
          }
          trap cleanup EXIT

          printf '%s\n' "$GHCR_TOKEN" \
            | docker --config "$auth_dir" login ghcr.io -u "$GHCR_USER" --password-stdin >/dev/null
          unset GHCR_TOKEN

          # Reclaim before pulling, not after deploying.
          #
          # The roll step already prunes dangling layers, but it does that on the
          # way out, after a healthy container. That ordering cannot recover a VM
          # that is already full: the pull happens first, so the disk that needs
          # clearing is what stops the run from ever reaching the line that clears
          # it. A deploy died exactly there — mid-extract, "no space left on
          # device", with a prune sitting a hundred lines further down the same
          # workflow that would have freed the space.
          #
          # `dangling=true` cannot reclaim a deploy like this one, and the first
          # attempt at this fix proved it: 1.6 GB free before the prune, 1.6 GB
          # after, on a host whose largest single object was a 12.6 GB image no
          # container referenced.
          #
          # The reason is the deploy model. Images arrive here by digest, so each
          # one keeps a repo-digest reference for as long as it exists. It prints
          # as <none>/<none> and reads like garbage, but Docker does not consider
          # it dangling and no dangling filter will ever remove it. Every past
          # deploy therefore accumulated, on a VM that pruned after every
          # successful deploy — the cleanup had been a no-op since it was written.
          #
          # `-a` with an age filter is what actually reclaims. It is still not a
          # blanket prune: an image any container references is never removed, so
          # the running service and its neighbours on this shared VM are safe by
          # construction rather than by hoping the filter is narrow enough. The
          # week keeps rollback targets — the roll step below rolls back to the
          # previous image, and a deploy cadence measured in hours means seven days
          # is many rollbacks deep.
          docker_root=$(docker info -f '{{.DockerRootDir}}' 2>/dev/null || echo /var/lib/docker)
          echo "Disk before reclaim:"
          df -h "$docker_root" || true
          docker --config "$auth_dir" image prune -af --filter "until=168h" 2>&1 | tail -1 || true
          docker builder prune -f >/dev/null 2>&1 || true
          echo "Disk after reclaim:"
          df -h "$docker_root" || true

          # On failure, say what is actually consuming the disk. Unqualified, the
          # pull reports only the one layer that could not be written, which names
          # a Python wheel and implies the image is at fault — the next reader goes
          # looking in the wrong repository. `docker system df` names the real
          # tenant, and if the safe reclaim above was not enough, this output is
          # what decides whether the answer is a bigger disk or a human choosing
          # which component's images to evict.
          if ! docker --config "$auth_dir" pull "$IMAGE_REF"; then
            echo "::error::Image pull failed on the VM. Disk and image usage follow."
            df -h "$docker_root" || true
            docker system df -v 2>/dev/null | head -40 || docker system df || true
            exit 1
          fi
          docker image inspect "$IMAGE_REF" >/dev/null
          echo "Image pull preflight passed."
          REMOTE

      # The component's own precondition, checked while the VM is still untouched:
      # for example, that its database is in the shape this release expects.
      - name: Component preflight on the VM
        if: ${{ inputs.preflight != '' }}
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
          PREFLIGHT: ${{ inputs.preflight }}
        run: |
          set -euo pipefail
          if ! ssh -i ~/.ssh/deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
               "cd '${{ inputs.remote_path }}' && bash -euo pipefail -c $(printf '%q' "$PREFLIGHT")"; then
            echo "::error::The component preflight failed; nothing on the VM was changed."
            exit 1
          fi
          echo "Component preflight passed."

      - name: Ship the compose file
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
        run: |
          compose_source="${{ inputs.compose_file }}"
          if [[ "$compose_source" == platform:* ]]; then
            relative="${compose_source#platform:}"
            if [[ "$relative" == /* || "$relative" == *..* ]]; then
              echo "::error::Platform compose path must stay inside its checkout"
              exit 1
            fi
            compose_source=".platform-release/$relative"
          fi
          test -f "$compose_source"
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            "mkdir -p '${{ inputs.remote_path }}'"
          scp -i ~/.ssh/deploy_key -P "$VM_PORT" \
            "$compose_source" \
            "$VM_USER@$VM_HOST:${{ inputs.remote_path }}/docker-compose.yml"

      # Files the compose file mounts from beside itself, from the same commit, so
      # a database initialised later never runs stale SQL.
      - name: Ship supporting files
        if: ${{ inputs.ship != '' }}
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
          SHIP: ${{ inputs.ship }}
        run: |
          set -euo pipefail
          read -r -a paths <<<"$SHIP"
          tar -czf - -- "${paths[@]}" \
            | ssh -i ~/.ssh/deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
                "cd '${{ inputs.remote_path }}' && tar -xzf -"
          echo "Shipped: $SHIP"

      # Infrastructure credentials for one-shot phases only (`env_file: [.env.infra]`).
      # `VM_*` secrets never reach the application .env, so this one cannot leak
      # into the API, migration or worker containers through inject-secrets.
      - name: Ship the infrastructure env
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
          VM_ENV_INFRA: ${{ secrets.VM_ENV_INFRA }}
        run: |
          set -euo pipefail
          if [[ -z "${VM_ENV_INFRA:-}" ]]; then
            echo "::notice::No VM_ENV_INFRA secret; leaving any .env.infra on the VM untouched."
            exit 0
          fi
          umask 077
          printf '%s\n' "$VM_ENV_INFRA" >"$RUNNER_TEMP/infra.env"
          scp -i ~/.ssh/deploy_key -P "$VM_PORT" "$RUNNER_TEMP/infra.env" \
            "$VM_USER@$VM_HOST:${{ inputs.remote_path }}/.env.infra"
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            "chmod 600 '${{ inputs.remote_path }}/.env.infra'"
          rm -f "$RUNNER_TEMP/infra.env"
          echo "Shipped .env.infra (contents masked)."

      # Runtime application secrets: pulled from Infisical into a .env and shipped
      # to the VM for the compose `env_file: [.env]`. Never stored in the repo. When
      # Infisical is not configured this yields an empty file and the real .env is
      # expected out-of-band on the box (placed once, survives redeploys).
      - name: Resolve runtime secrets → .env
        uses: arteamis-system/platform/actions/inject-secrets@6e2ed6cac61699622e567531c89af40d83600244
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          # Without Infisical, the .env is built from these Environment secrets, so
          # changing an app env var is a GitHub UI edit + redeploy — never an SSH.
          RUNTIME_SECRETS_JSON: ${{ toJSON(secrets) }}
        with:
          project: ${{ inputs.project }}
          environment: ${{ inputs.environment }}
          export_to_env_file: ${{ runner.temp }}/app.env

      # Ship it only when Infisical actually populated it, so an unconfigured repo
      # keeps whatever .env is already on the box instead of overwriting it empty.
      - name: Ship the .env to the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
        run: |
          if [[ -s "${{ runner.temp }}/app.env" ]]; then
            scp -i ~/.ssh/deploy_key -P "$VM_PORT" "${{ runner.temp }}/app.env" \
              "$VM_USER@$VM_HOST:${{ inputs.remote_path }}/.env"
            echo "Shipped runtime .env from Infisical."
          else
            echo "::notice::No Infisical .env; leaving the VM's existing .env untouched."
          fi

      # The image reference is the only thing the compose file needs from CI —
      # application secrets live on the VM (or come from the secrets manager),
      # never in the repository.
      - name: Pin the image digest on the VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
        run: |
          # Each component owns its own directory on the VM, so a single IMAGE
          # variable is unambiguous even when three components share the box.
          printf 'IMAGE=%s\n' "${{ inputs.image_ref }}" >image.env
          scp -i ~/.ssh/deploy_key -P "$VM_PORT" image.env \
            "$VM_USER@$VM_HOST:${{ inputs.remote_path }}/image.env"

      - name: Roll the service
        id: roll
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_PORT: ${{ secrets.VM_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$VM_PORT" "$VM_USER@$VM_HOST" \
            REMOTE_PATH='${{ inputs.remote_path }}' \
            SERVICE='${{ inputs.service }}' \
            CONTAINER='${{ inputs.container_name }}' \
            IMAGE_REF='${{ inputs.image_ref }}' \
            PHASES='${{ inputs.phases }}' \
            SERVICES='${{ inputs.services || inputs.service }}' \
            MIGRATION_PHASE='${{ inputs.migration_phase }}' \
            bash -se <<'REMOTE'
          set -euo pipefail
          cd "$REMOTE_PATH"

          # Compose files declare `env_file: [.env]`. The .env is shipped by CI from
          # Infisical when configured, or placed on the host out of band otherwise.
          # Guarantee it exists so a fresh VM never fails the very first deploy.
          touch .env

          # Remember what is running so a failed rollout can be undone.
          previous=$(docker inspect --format '{{.Config.Image}}' "$CONTAINER" 2>/dev/null || echo "")
          echo "Currently running: ${previous:-<nothing>}"

          roll() {
            # The exact digest passed its pull preflight before any deploy files
            # changed. Never contact the registry during the state-changing step.
            docker compose --env-file image.env up -d --no-deps --force-recreate --pull never "$SERVICE"
          }

          wait_healthy() {
            for _ in $(seq 1 30); do
              status=$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$CONTAINER" 2>/dev/null || echo missing)
              running=$(docker inspect --format '{{.State.Running}}' "$CONTAINER" 2>/dev/null || echo false)
              if [[ "$status" == "healthy" ]]; then
                echo "Container is healthy."
                return 0
              fi
              if [[ "$status" == "none" && "$running" == "true" ]]; then
                echo "Container is running (no healthcheck defined)."
                return 0
              fi
              if [[ "$status" == "unhealthy" ]]; then
                echo "Container reported unhealthy."
                return 1
              fi
              sleep 4
            done
            echo "Timed out waiting for $CONTAINER to become healthy."
            return 1
          }

          if [[ -n "$PHASES" ]]; then
            read -r -a phases <<<"$PHASES"
            read -r -a services <<<"$SERVICES"
            compose=(docker compose --env-file image.env)

            phase_started() {
              local id
              id=$("${compose[@]}" ps -a -q "$1" 2>/dev/null | head -1)
              [[ -n "$id" ]] || return 1
              [[ "$(docker inspect --format '{{.State.StartedAt}}' "$id")" != 0001-01-01T00:00:00Z ]]
            }

            # Stop consumers first, newest dependants first, so nothing reads a
            # catalog that is being changed underneath it.
            for (( i=${#services[@]}-1; i>=0; i-- )); do
              "${compose[@]}" stop "${services[$i]}" 2>/dev/null || true
            done
            # Remove the previous run's one-shot containers so "started" below
            # can only mean "started by this release".
            "${compose[@]}" rm -f "${phases[@]}" >/dev/null 2>&1 || true

            # Compose runs the phases in dependency order and refuses to start a
            # dependant whose predecessor failed or is unhealthy.
            if "${compose[@]}" up -d --force-recreate --pull never "${phases[@]}" "${services[@]}" && wait_healthy; then
              docker image prune -af --filter "until=168h" >/dev/null || true
              "${compose[@]}" ps -a
              echo "Deployed ${PHASES} -> ${SERVICES} at $IMAGE_REF"
              exit 0
            fi

            "${compose[@]}" ps -a || true
            for name in "${phases[@]}" "${services[@]}"; do
              echo "--- $name"
              "${compose[@]}" logs --tail 40 "$name" 2>&1 || true
            done
            if [[ -n "$MIGRATION_PHASE" ]] && phase_started "$MIGRATION_PHASE"; then
              "${compose[@]}" stop "${services[@]}" 2>/dev/null || true
              echo "::error::The release failed after $MIGRATION_PHASE started. The schema may have changed,"
              echo "::error::so the previous image was NOT restarted. Services are stopped; restore or fix forward."
              exit 1
            fi
            if [[ -n "$previous" ]]; then
              echo "No migration ran; rolling the services back to $previous"
              printf 'IMAGE=%s\n' "$previous" >image.env
              if "${compose[@]}" up -d --no-deps --force-recreate --pull never "${services[@]}" && wait_healthy; then
                echo "Rolled back successfully; the previous version is serving again."
              else
                echo "Rollback also failed — this VM needs a human."
              fi
            fi
            exit 1
          fi

          roll
          if ! wait_healthy; then
            docker logs --tail 80 "$CONTAINER" 2>&1 || true
            if [[ -n "$previous" ]]; then
              echo "Rolling back to $previous"
              printf 'IMAGE=%s\n' "$previous" >image.env
              if roll && wait_healthy; then
                echo "Rolled back successfully; the previous version is serving again."
              else
                echo "Rollback also failed — this VM needs a human."
              fi
            fi
            exit 1
          fi

          # Matches the preflight reclaim, and for the same reason: images pulled
          # by digest never become dangling, so the filter that used to be here
          # removed nothing at all. Still never a blanket prune — `-a` leaves any
          # image a container references, which is what protects the other
          # components sharing this VM, and the week protects rollback targets.
          docker image prune -af --filter "until=168h" >/dev/null || true
          echo "Deployed $SERVICE at $IMAGE_REF"
          REMOTE

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Deploy — \`${{ inputs.component }}\` → **${{ inputs.environment }}**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| image | \`${{ inputs.image_ref }}\` |"
            if [[ -n "${{ inputs.phases }}" ]]; then
              echo "| phases | \`${{ inputs.phases }}\` |"
              echo "| services | \`${{ inputs.services || inputs.service }}\` |"
            else
              echo "| compose service | \`${{ inputs.service }}\` (recreated with \`--no-deps\`) |"
            fi
            echo "| source | \`${{ github.sha }}\` |"
            echo "| platform | \`${{ steps.platform.outputs.sha }}\` |"
            echo "| result | ${{ steps.roll.outcome }} |"
            if [[ -n "${{ inputs.url }}" ]]; then echo "| url | ${{ inputs.url }} |"; fi
          } >>"$GITHUB_STEP_SUMMARY"

      # The release record: which source, artifact and platform revision this
      # environment was given, and whether it took. A GitHub deployment is durable
      # and queryable (`gh api repos/<repo>/deployments?task=release`), unlike a
      # job summary or an expiring artifact.
      - name: Record the release
        if: ${{ always() && steps.roll.outcome != 'skipped' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.roll.outcome }}
          IMAGE_REF: ${{ inputs.image_ref }}
          PLATFORM_SHA: ${{ steps.platform.outputs.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          URL: ${{ inputs.url }}
        run: |
          set -euo pipefail
          jq -n --arg ref "$GITHUB_SHA" --arg env "$ENVIRONMENT" --arg image "$IMAGE_REF" \
                --arg platform "$PLATFORM_SHA" --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '{ref: $ref, environment: $env, task: "release", auto_merge: false, required_contexts: [],
              production_environment: ($env == "production"),
              description: ("image " + ($image | split("@") | last | .[0:19])),
              payload: {image_ref: $image, platform_sha: $platform, run: $run}}' >"$RUNNER_TEMP/deployment.json"
          id=$(gh api "repos/$GITHUB_REPOSITORY/deployments" --input "$RUNNER_TEMP/deployment.json" --jq .id)
          state=$([[ "$OUTCOME" == "success" ]] && echo success || echo failure)
          gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses" \
            -f state="$state" -f environment_url="$URL" \
            -f log_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" >/dev/null
          echo "Recorded release deployment $id ($state)."
