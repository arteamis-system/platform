name: deploy-vercel

# Full Vercel CLI control — env vars, aliases, domains — driven from CI rather
# than from a git integration, so a frontend deploy is the same reviewed,
# gated pipeline as every other component.

on:
  workflow_call:
    inputs:
      project:     { type: string, required: true }
      component:   { type: string, required: true }
      environment: { type: string, required: true } # staging | production
      url:         { type: string, required: false, default: "" }
      alias:
        description: Optional domain to point at this deployment.
        type: string
        required: false
        default: ""

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: deploy ${{ inputs.component }} → ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Validate deploy secrets
        run: |
          missing=()
          if [[ -z "$VERCEL_TOKEN"      ]]; then missing+=("VERCEL_TOKEN"); fi
          if [[ -z "$VERCEL_ORG_ID"     ]]; then missing+=("VERCEL_ORG_ID"); fi
          if [[ -z "$VERCEL_PROJECT_ID" ]]; then missing+=("VERCEL_PROJECT_ID"); fi
          if (( ${#missing[@]} )); then
            echo "::error::Missing secrets for the '${{ inputs.environment }}' environment: ${missing[*]}"
            echo "::error::Get the IDs from .vercel/project.json after 'vercel link', then:"
            echo "::error::gh secret set ${missing[0]} --repo ${{ github.repository }} --env ${{ inputs.environment }}"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - run: npm install --global vercel@latest

      # Vercel calls a non-production deployment "preview".
      - name: Resolve Vercel target
        id: target
        run: |
          if [[ "${{ inputs.environment }}" == "production" ]]; then
            echo "target=production" >>"$GITHUB_OUTPUT"
            echo "prod_flag=--prod" >>"$GITHUB_OUTPUT"
          else
            echo "target=preview" >>"$GITHUB_OUTPUT"
            echo "prod_flag=" >>"$GITHUB_OUTPUT"
          fi

      # Runtime configuration is reconciled from the secrets manager on every
      # deploy, so the Vercel dashboard is a projection of source control rather
      # than a place where configuration quietly diverges.
      - name: Sync environment variables
        uses: arteamis-system/platform/actions/inject-secrets@v1
        with:
          project: ${{ inputs.project }}
          environment: ${{ inputs.environment }}

      - name: Pull project settings
        run: vercel pull --yes --environment=${{ steps.target.outputs.target }} --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt output
        id: deploy
        run: |
          url=$(vercel deploy --prebuilt ${{ steps.target.outputs.prod_flag }} --token="$VERCEL_TOKEN")
          echo "url=$url" >>"$GITHUB_OUTPUT"
          echo "Deployed to $url"

      - name: Point the alias at this deployment
        if: ${{ inputs.alias != '' }}
        run: |
          vercel alias set "${{ steps.deploy.outputs.url }}" "${{ inputs.alias }}" --token="$VERCEL_TOKEN"

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Deploy — \`${{ inputs.component }}\` → **${{ inputs.environment }}**"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| target | \`${{ steps.target.outputs.target }}\` |"
            echo "| deployment | ${{ steps.deploy.outputs.url }} |"
            if [[ -n "${{ inputs.alias }}" ]]; then echo "| alias | https://${{ inputs.alias }} |"; fi
          } >>"$GITHUB_STEP_SUMMARY"
