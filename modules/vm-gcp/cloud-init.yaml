#cloud-config
# Everything the deploy workflow assumes about a VM is created here, so a fresh
# instance is deployable the moment terraform apply finishes. Identical contract
# to vm-aws/vm so deploy-vm.yml treats every cloud the same: a `deploy` user with
# docker, and /opt/<project> owned by it.
package_update: true
packages:
  - docker.io
  - docker-compose-v2
  - fail2ban
  - unattended-upgrades

users:
  - name: deploy
    groups: [docker, sudo]
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ${deploy_key}

write_files:
  - path: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      KbdInteractiveAuthentication no

runcmd:
  - systemctl enable --now docker
  - mkdir -p /opt/${project}
  - chown -R deploy:deploy /opt/${project}
  # One shared network so components on this box can reach each other by name.
  - docker network create ${project}_net || true
  - systemctl restart ssh
