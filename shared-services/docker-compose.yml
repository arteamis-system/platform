# Shared services for a project VM: the edge (Traefik, auto-TLS) and the database
# (Postgres, persistent). Deployed ONCE per VM to /opt/<project>/edge, before the
# app components. Components join ${PROJECT}_net; Traefik routes to them from
# per-component files in ./dynamic and terminates TLS — no nginx/certbot to edit.
#
#   PROJECT=tasmil DOMAIN=tasmil.finance ACME_EMAIL=you@tasmil.finance \
#   CF_DNS_API_TOKEN=<cloudflare token> POSTGRES_PASSWORD=<...> \
#   docker compose -p ${PROJECT}-edge up -d
#
# Verified end-to-end on AWS 2026-07-31: real Let's Encrypt cert (DNS-01) + routing.
name: ${PROJECT}-edge

services:
  traefik:
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      # All plain HTTP is redirected to HTTPS at the edge.
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      # Routes come from files in /dynamic (one per component), NOT the Docker
      # socket: the socket provider cannot negotiate against this host's daemon
      # ("client version 1.24 is too old" — reproduced on docker.io AND docker-ce).
      # The file provider sidesteps it and still hot-reloads on file changes.
      - --providers.file.directory=/dynamic
      - --providers.file.watch=true
      # Auto-TLS via Let's Encrypt using Cloudflare DNS-01 — issues certs without
      # any inbound hit, so *.${DOMAIN} works the moment DNS points here.
      - --certificatesresolvers.le.acme.dnschallenge=true
      - --certificatesresolvers.le.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.le.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.le.acme.storage=/acme/acme.json
    environment:
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # One route file per component; deploy-vm drops <component>.yml here.
      - /opt/${PROJECT}/edge/dynamic:/dynamic:ro
      - acme:/acme
    networks: [default]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-${PROJECT}}
    volumes:
      # Data volume lives on the host so a container rebuild never loses the DB.
      - /opt/${PROJECT}/data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [default]
    # Not published to the host: only reachable by other containers on the network.

volumes:
  acme:

# The one shared network every component on this VM joins. Created by cloud-init
# as ${PROJECT}_net; declared external so compose attaches instead of recreating.
networks:
  default:
    name: ${PROJECT}_net
    external: true
