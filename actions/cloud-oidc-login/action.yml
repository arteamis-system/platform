name: cloud-oidc-login
description: >-
  Exchange the job's GitHub OIDC token for short-lived cloud credentials.
  Repos never store cloud keys; the trust policy lives in the cloud, scoped to
  repo + environment. One interface over AWS, GCP, Azure and DigitalOcean.

inputs:
  provider:
    description: aws | gcp | azure | digitalocean | none
    required: true
  region:
    required: false
    default: ap-southeast-1
  # AWS
  role_to_assume:
    required: false
    default: ""
  # GCP
  workload_identity_provider:
    required: false
    default: ""
  service_account:
    required: false
    default: ""
  # Azure
  client_id:
    required: false
    default: ""
  tenant_id:
    required: false
    default: ""
  subscription_id:
    required: false
    default: ""

runs:
  using: composite
  steps:
    - if: ${{ inputs.provider == 'none' }}
      shell: bash
      run: echo "::notice::No cloud login requested for this job."

    # Skip with a clear message when the role isn't configured yet, so the failure
    # surfaces as terraform's own "no credentials" at plan time rather than an
    # opaque action error before the stack has even been validated.
    - if: ${{ inputs.provider == 'aws' && inputs.role_to_assume == '' }}
      shell: bash
      run: echo "::warning::AWS_ROLE_ARN is not set; run bootstrap/aws-oidc and set the variable. terraform plan/apply will fail until then."

    - if: ${{ inputs.provider == 'aws' && inputs.role_to_assume != '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        role-to-assume: ${{ inputs.role_to_assume }}
        aws-region: ${{ inputs.region }}
        # No access key: the OIDC JWT is exchanged for ~15 minute credentials.

    - if: ${{ inputs.provider == 'gcp' }}
      uses: google-github-actions/auth@v3
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        service_account: ${{ inputs.service_account }}

    - if: ${{ inputs.provider == 'azure' }}
      uses: azure/login@v3
      with:
        client-id: ${{ inputs.client_id }}
        tenant-id: ${{ inputs.tenant_id }}
        subscription-id: ${{ inputs.subscription_id }}

    # DigitalOcean has no OIDC federation yet, so this is the one place a stored
    # token is unavoidable. Keep it environment-scoped and rotate it on a schedule.
    - if: ${{ inputs.provider == 'digitalocean' }}
      shell: bash
      run: |
        # We don't hard-fail here: fmt/init/validate have already run, and letting
        # terraform itself report the missing credential gives a clearer, provider-
        # level error than aborting the whole job before the plan is attempted.
        if [[ -z "${DIGITALOCEAN_ACCESS_TOKEN:-}" ]]; then
          echo "::warning::DIGITALOCEAN_ACCESS_TOKEN is not set; terraform plan/apply will fail until it is added as a secret."
        else
          echo "::notice::DigitalOcean does not support OIDC federation; using a scoped stored token."
        fi
