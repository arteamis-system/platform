name: load-manifest
description: >-
  Parse a repository's .platform.yml into workflow outputs and resolve the target
  environment from the current git ref. This is the only place the manifest schema
  is interpreted.

inputs:
  path:
    description: Path to the manifest inside the caller repository.
    required: false
    default: .platform.yml

outputs:
  project:         { description: Project family name,                 value: "${{ steps.parse.outputs.project }}" }
  component:       { description: Component name within the project,   value: "${{ steps.parse.outputs.component }}" }
  type:            { description: service | frontend | contract,       value: "${{ steps.parse.outputs.type }}" }
  runtime:         { description: node | python | go | rust | solidity, value: "${{ steps.parse.outputs.runtime }}" }
  package_manager: { description: npm | pnpm | uv | poetry | cargo,    value: "${{ steps.parse.outputs.package_manager }}" }

  test_command:    { description: The one thing that varies per repo,  value: "${{ steps.parse.outputs.test_command }}" }
  lint_command:    { description: Optional lint command,               value: "${{ steps.parse.outputs.lint_command }}" }
  coverage_min:    { description: Minimum coverage percent,            value: "${{ steps.parse.outputs.coverage_min }}" }
  ai_review:       { description: Whether the AI review step runs,     value: "${{ steps.parse.outputs.ai_review }}" }

  dockerfile:      { description: Dockerfile path,                     value: "${{ steps.parse.outputs.dockerfile }}" }
  context:         { description: Docker build context,                value: "${{ steps.parse.outputs.context }}" }
  image:           { description: Fully qualified GHCR image name,     value: "${{ steps.parse.outputs.image }}" }

  target:          { description: vm | vercel | none,                  value: "${{ steps.parse.outputs.target }}" }
  registry_user:   { description: Account paired with GHCR_PULL_TOKEN, value: "${{ steps.parse.outputs.registry_user }}" }
  service:         { description: docker compose service name,         value: "${{ steps.parse.outputs.service }}" }
  container_name:  { description: Running container name,              value: "${{ steps.parse.outputs.container_name }}" }
  compose_file:    { description: Compose file shipped to the VM,      value: "${{ steps.parse.outputs.compose_file }}" }
  remote_path:     { description: Deploy directory on the VM,          value: "${{ steps.parse.outputs.remote_path }}" }
  health_path:     { description: HTTP health endpoint,                value: "${{ steps.parse.outputs.health_path }}" }
  health_port:     { description: Container port to health check,      value: "${{ steps.parse.outputs.health_port }}" }

  environment:     { description: "Resolved environment; empty when this ref does not deploy", value: "${{ steps.parse.outputs.environment }}" }
  url:             { description: Public URL for this environment,     value: "${{ steps.parse.outputs.url }}" }
  should_build:    { description: 'true when an image must be built',  value: "${{ steps.parse.outputs.should_build }}" }
  should_deploy:   { description: 'true when a deploy must run',       value: "${{ steps.parse.outputs.should_deploy }}" }

  # --- tester agent (TRD §3.2) ---
  tester_enabled:         { description: Agent opted in,                value: "${{ steps.parse.outputs.tester_enabled }}" }
  tester_base_url_secret: { description: Secret holding the target URL, value: "${{ steps.parse.outputs.tester_base_url_secret }}" }
  tester_openapi:         { description: Path to the OpenAPI spec,      value: "${{ steps.parse.outputs.tester_openapi }}" }
  tester_mutating:        { description: Allow mutating requests,       value: "${{ steps.parse.outputs.tester_mutating }}" }
  tester_model:           { description: VP gateway model id,           value: "${{ steps.parse.outputs.tester_model }}" }
  slo_p95_ms:             { description: p95 SLO in ms,                 value: "${{ steps.parse.outputs.slo_p95_ms }}" }
  slo_p99_ms:             { description: p99 SLO in ms,                 value: "${{ steps.parse.outputs.slo_p99_ms }}" }
  slo_error_pct:          { description: Error-rate SLO,                value: "${{ steps.parse.outputs.slo_error_pct }}" }
  soak_enabled:           { description: Soak gate opted in,            value: "${{ steps.parse.outputs.soak_enabled }}" }
  soak_iterations:        { description: Soak iteration cap,            value: "${{ steps.parse.outputs.soak_iterations }}" }
  soak_budget_minutes:    { description: Soak wall-clock cap,           value: "${{ steps.parse.outputs.soak_budget_minutes }}" }
  soak_budget_usd:        { description: Soak spend cap,                value: "${{ steps.parse.outputs.soak_budget_usd }}" }
  soak_gate_on:           { description: Finding classes that block,    value: "${{ steps.parse.outputs.soak_gate_on }}" }
  monitor_enabled:        { description: Scheduled monitor opted in,    value: "${{ steps.parse.outputs.monitor_enabled }}" }
  monitor_schedule:       { description: Monitor cron,                  value: "${{ steps.parse.outputs.monitor_schedule }}" }
  monitor_target:         { description: staging | live_readonly,       value: "${{ steps.parse.outputs.monitor_target }}" }
  should_soak:            { description: 'true when the soak gate runs', value: "${{ steps.parse.outputs.should_soak }}" }

  # --- findings routing (TRD §8) ---
  issues_repo:             { description: self or owner/repo,            value: "${{ steps.parse.outputs.issues_repo }}" }
  auto_close_after_runs:   { description: Absent runs before auto-close, value: "${{ steps.parse.outputs.auto_close_after_runs }}" }
  lark_notify_on:          { description: Events that reach Lark,        value: "${{ steps.parse.outputs.lark_notify_on }}" }
  baseline_metric:         { description: p50 | p95 | p99,               value: "${{ steps.parse.outputs.baseline_metric }}" }
  baseline_drift_pct:      { description: Drift threshold percent,       value: "${{ steps.parse.outputs.baseline_drift_pct }}" }
  baseline_sustained_runs: { description: Runs before drift is flagged,  value: "${{ steps.parse.outputs.baseline_sustained_runs }}" }

runs:
  using: composite
  steps:
    - name: Ensure yq is available
      shell: bash
      run: |
        # The manifest schema is expressed in mikefarah yq syntax. A runner that
        # ships a different yq (e.g. the python one) would parse it wrongly, so we
        # install a known-good binary unless mikefarah's is already present.
        if ! yq --version 2>/dev/null | grep -qi mikefarah; then
          echo "::notice::installing mikefarah yq"
          sudo curl -sSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq
        fi
        yq --version

    - name: Parse manifest and resolve environment
      id: parse
      shell: bash
      env:
        MANIFEST: ${{ inputs.path }}
        EVENT_NAME: ${{ github.event_name }}
        REF_NAME: ${{ github.ref_name }}
        REPO: ${{ github.repository }}
      run: ${{ github.action_path }}/parse.sh
