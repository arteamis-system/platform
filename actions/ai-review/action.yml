name: ai-review
description: >-
  Opt-in AI review of the change under test. Standardised in, standardised out:
  it consumes the same manifest the rest of the pipeline does and writes to the
  job summary, so it never becomes bespoke per repo.

  Runs on the Virtuals Protocol gateway (OpenAI-compatible), so one
  VIRTUALS_API_KEY covers every model the org uses.

inputs:
  component:
    required: true
  runtime:
    required: true
  coverage:
    description: Coverage percentage produced by the test job.
    required: false
    default: ""
  model:
    description: VP gateway model id.
    required: false
    default: anthropic-claude-sonnet-5
  base_url:
    required: false
    default: https://compute.virtuals.io/v1

runs:
  using: composite
  steps:
    - name: Review the diff
      shell: bash
      env:
        COMPONENT: ${{ inputs.component }}
        RUNTIME: ${{ inputs.runtime }}
        COVERAGE: ${{ inputs.coverage }}
        MODEL: ${{ inputs.model }}
        BASE_URL: ${{ inputs.base_url }}
        BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: |
        set -euo pipefail
        if [[ -z "${VIRTUALS_API_KEY:-}" ]]; then
          echo "::notice::ai_review is enabled but VIRTUALS_API_KEY is not set; skipping."
          echo "### AI review — skipped (no VIRTUALS_API_KEY)" >>"$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        base="${BASE_SHA:-}"
        if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
          base="$(git rev-parse HEAD~1 2>/dev/null || echo HEAD)"
        fi

        diff="$(git diff "$base...HEAD" -- . \
          ':(exclude)**/*.lock' ':(exclude)**/package-lock.json' ':(exclude)**/pnpm-lock.yaml' \
          | head -c 120000)"
        if [[ -z "$diff" ]]; then
          echo "### AI review — no source changes to review" >>"$GITHUB_STEP_SUMMARY"
          exit 0
        fi

        prompt="You are reviewing a change to the '${COMPONENT}' component (${RUNTIME}). Test coverage: ${COVERAGE:-unknown}%.
        Report only concrete defects, missing test cases, and security risks. Be brief and specific; if the change is fine, say so in one line.

        Diff:
        ${diff}"

        # max_tokens is kept well above the reasoning-model floor: several models
        # on this gateway spend their budget on hidden reasoning and would
        # otherwise return empty content.
        jq -n --arg m "$MODEL" --arg p "$prompt" \
          '{model:$m, max_tokens:1200, messages:[{role:"user", content:$p}]}' >/tmp/req.json

        http=$(curl -sS -o /tmp/resp.json -w '%{http_code}' "${BASE_URL}/chat/completions" \
          -H "Authorization: Bearer ${VIRTUALS_API_KEY}" \
          -H "content-type: application/json" \
          -d @/tmp/req.json) || true

        # The gateway returns 201 on success, not 200 — accept any 2xx.
        if [[ ! "$http" =~ ^2[0-9][0-9]$ ]]; then
          echo "::warning::AI review call failed (HTTP $http); not blocking the pipeline."
          exit 0
        fi

        {
          echo "### AI review — \`${COMPONENT}\` (${MODEL})"
          echo ""
          jq -r '.choices[0].message.content // .choices[0].message.reasoning_content // "(empty response)"' /tmp/resp.json
        } >>"$GITHUB_STEP_SUMMARY"
