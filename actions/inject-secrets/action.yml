name: inject-secrets
description: >-
  Fetch runtime application secrets for one project+environment from Infisical and
  export them to the job. Repos never enumerate their own secrets; they declare
  which project and environment they are, and the platform resolves the rest.

inputs:
  project:
    required: true
  environment:
    description: staging | production
    required: true
  path:
    description: Infisical folder path within the project.
    required: false
    default: /
  export_to_env_file:
    description: Also write the secrets to this file (consumed by docker compose --env-file).
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Resolve secret source
      id: source
      shell: bash
      run: |
        if [[ -n "${INFISICAL_CLIENT_ID:-}" && -n "${INFISICAL_CLIENT_SECRET:-}" ]]; then
          echo "available=true" >>"$GITHUB_OUTPUT"
        else
          echo "available=false" >>"$GITHUB_OUTPUT"
          echo "::notice::Infisical is not configured for this repo; falling back to GitHub Environment secrets for '${{ inputs.environment }}'."
        fi

    # Frontend / job-env case: export the secrets as environment variables for the
    # steps that follow (e.g. `vercel build` reading NEXT_PUBLIC_*). Used when no
    # env file is requested.
    - if: ${{ steps.source.outputs.available == 'true' && inputs.export_to_env_file == '' }}
      name: Pull secrets from Infisical → job env
      uses: Infisical/secrets-action@v1.0.16
      with:
        method: universal
        client-id: ${{ env.INFISICAL_CLIENT_ID }}
        client-secret: ${{ env.INFISICAL_CLIENT_SECRET }}
        project-slug: ${{ inputs.project }}
        env-slug: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
        secret-path: ${{ inputs.path }}
        export-type: env

    # VM / docker-compose case: materialise a real .env file the deploy can ship to
    # the box for `env_file: [.env]`. The Infisical action writes the dotenv itself,
    # so no secret is ever echoed into a log or a run: step.
    - if: ${{ steps.source.outputs.available == 'true' && inputs.export_to_env_file != '' }}
      name: Pull secrets from Infisical → .env file
      uses: Infisical/secrets-action@v1.0.16
      with:
        method: universal
        client-id: ${{ env.INFISICAL_CLIENT_ID }}
        client-secret: ${{ env.INFISICAL_CLIENT_SECRET }}
        project-slug: ${{ inputs.project }}
        env-slug: ${{ inputs.environment == 'production' && 'prod' || 'staging' }}
        secret-path: ${{ inputs.path }}
        export-type: file
        file-output-path: ${{ inputs.export_to_env_file }}

    - if: ${{ inputs.export_to_env_file != '' }}
      name: Secure the env file (and, without Infisical, build it from GitHub secrets)
      shell: bash
      env:
        ENV_FILE: ${{ inputs.export_to_env_file }}
        AVAILABLE: ${{ steps.source.outputs.available }}
        # The caller passes toJSON(secrets) here so, when Infisical is not set up,
        # the .env is materialised from GitHub Environment secrets — change a value
        # in the repo's Environment settings, redeploy, done. No SSH to the box.
        RUNTIME_SECRETS_JSON: ${{ env.RUNTIME_SECRETS_JSON }}
      run: |
        if [[ "$AVAILABLE" != "true" ]]; then
          if [[ -n "${RUNTIME_SECRETS_JSON:-}" && "$RUNTIME_SECRETS_JSON" != "null" && "$RUNTIME_SECRETS_JSON" != "{}" ]]; then
            # Everything except platform/infra plumbing becomes an app env var.
            deny='VM_HOST VM_USER VM_SSH_KEY VM_PORT GHCR_PULL_TOKEN INFISICAL_CLIENT_ID INFISICAL_CLIENT_SECRET GITHUB_TOKEN github_token VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID SOPS_AGE_KEY TESTER_BASE_URL RUNTIME_SECRETS_JSON'
            denyjq="$(printf '%s\n' $deny | jq -R . | jq -s .)"
            : >"$ENV_FILE"
            printf '%s' "$RUNTIME_SECRETS_JSON" \
              | jq -r --argjson deny "$denyjq" \
                  'to_entries[] | select((.key | ascii_upcase | startswith("VM_")) or ([.key] | inside($deny)) | not) | "\(.key)=\(.value)"' \
              >>"$ENV_FILE"
            n="$(grep -c . "$ENV_FILE" || true)"
            echo "::notice::Wrote $ENV_FILE from $n GitHub Environment secret(s) (values masked)."
          else
            : >"$ENV_FILE"
            echo "::notice::No Infisical and no GitHub secrets provided; wrote empty $ENV_FILE (populate out-of-band)."
          fi
        fi
        chmod 600 "$ENV_FILE"
        echo "::notice::Runtime env file ready at $ENV_FILE (contents masked)."
